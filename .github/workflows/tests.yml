name: tests

# The suite drives the real page in a real Chromium via Playwright - there is no
# module system and no Node-side unit harness, so every "pure model" assertion
# also runs inside page.evaluate() against the real globals. That means CI needs a
# browser, not just Node.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  ui:
    name: browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # `npm ci` needs the lockfile to match package.json exactly; it does.
      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      # Installs the browser Playwright was pinned to, plus the shared libraries
      # headless Chromium needs on a bare runner. resolveChromium() in
      # ui.test.js prefers /opt/pw-browsers (the dev container's copy) and falls
      # through to Playwright's own download, which is what this provides.
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      # The page is loaded over file://, so nothing needs serving.
      - name: Run the UI test suite
        working-directory: tests
        run: npm test
