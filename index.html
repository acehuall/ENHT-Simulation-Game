<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trust in Balance: run a fictional NHS hospital board for a year. A work-experience and team-workshop game.">
  <meta name="theme-color" content="#0b1020">
  <title>Trust in Balance · Northbrook General</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="src/style.css">
  <script defer src="src/content.js"></script>
  <script defer src="src/engine.js"></script>
  <script defer src="src/pixel.js"></script>
  <script defer src="src/views.js"></script>
  <script defer src="src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#game">Skip to the game</a>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><img src="assets/mark.svg" alt="" width="34" height="34"><div>Trust in Balance<span>NORTHBROOK GENERAL · BOARD GAME</span></div></div>
      <nav aria-label="Game controls">
        <button type="button" class="header-btn" id="font-btn" aria-pressed="false" title="Switch to a plain, easier-to-read font">Aa</button>
        <button type="button" class="header-btn" id="facil-btn" aria-pressed="false" title="Show the facilitator prompt and a timer on each quarter">Facilitator</button>
        <button type="button" class="header-btn" data-action="guide">How to play</button>
        <button type="button" class="header-btn" id="journal-btn" data-action="journal" hidden>Minutes</button>
        <button type="button" class="header-btn" id="exit-btn" data-action="leave" hidden>Exit</button>
      </nav>
    </div>
  </header>
  <main id="game" tabindex="-1"></main>
  <div id="action-dock"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="print-area" aria-hidden="true"></div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p class="no-js">Turn on JavaScript to play Trust in Balance.</p></noscript>
</body>
</html>
